services:
  - type: web
    name: leadmarket-meta-ads
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEON_AUTH_BASE_URL
        value: https://ep-shy-rain-bd5macly.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth
      - key: NEON_AUTH_JWKS_URL
        value: https://ep-shy-rain-bd5macly.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth/.well-known/jwks.json
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        sync: false
      - key: META_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: META_OAUTH_REDIRECT_URI
        sync: false
